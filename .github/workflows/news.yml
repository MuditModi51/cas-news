name: CAS news to the phone
on:
  schedule:
    # every 10 minutes from 6:30 in the morning to 10:30 at night, India time
    - cron: "*/10 1-17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Send new headlines
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH: ${{ secrets.WATCH }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python3 notify.py
      - name: Keep the schedule alive
        # GitHub stops the schedule of a repository untouched for 60 days;
        # a tiny note is written once a month so that never happens
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "cas-news"
            git config user.email "cas-news@users.noreply.github.com"
            date -u > keepalive.txt
            git add keepalive.txt
            git commit -m "keep the schedule alive" && git push
          fi
